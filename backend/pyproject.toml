# Project metadata and dependency manifest (PEP 621) for the CapSpace backend.
# Defines the runtime dependencies, the dev/test dependency group, and the
# hatchling build configuration that packages the `app` module.

[project]
name = "capspace-backend"
version = "0.1.0"
description = "Real-time sports analytics platform — FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    # FastAPI + server
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic-settings>=2.0",
    # Database (async PostgreSQL)
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    # Redis
    "redis[hiredis]>=5.0",
    # Celery (task queue)
    "celery[redis]>=5.0",
    # HTTP client (for scrapers)
    "httpx>=0.28",
    # Data processing
    "pandas>=2.0",
    # Auth
    "python-jose[cryptography]>=3.0",
    "passlib[bcrypt]>=1.0",
    # Utilities
    "python-dotenv>=1.0",
    "sphinx>=9.0.4",
    "pandas-stubs~=3.0.3",
    "lxml>=6.1.1",
    "playwright>=1.60.0",
    "uliweb-alembic>=0.6.9",
]

[dependency-groups]
test = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "psycopg2-binary>=2.9",  # sync driver for the migration/hypertable test (admin + catalog queries)
]
dev = [
    {include-group = "test"},
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope="session"
asyncio_default_test_loop_scope="session"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
