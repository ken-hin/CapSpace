# Alembic configuration.
# Controls where migration scripts live, the database connection used for
# migrations, and Python logging during migration runs. The actual environment
# bootstrap and online/offline migration logic lives in alembic/env.py.

[alembic]
# Directory containing the migration environment (env.py) and versions/.
script_location = alembic
# Default database URL used for migrations (override per environment as needed).
sqlalchemy.url = postgresql+asyncpg://postgres:password@localhost:5432/sports_analytics

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
