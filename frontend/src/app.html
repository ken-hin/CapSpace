<!--
  SvelteKit HTML shell.

  The single page template SvelteKit injects the app into. The %sveltekit.*%
  placeholders are replaced at build/render time: %sveltekit.head% with
  per-page <head> tags and %sveltekit.body% with the rendered app markup.
  `data-sveltekit-preload-data="hover"` preloads route data on link hover.
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title></title>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" class="dark">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
