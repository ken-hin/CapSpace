# Project metadata and dependency manifest (PEP 621) for the CapSpace ML pipeline.
# Declares the data-science / ML runtime dependencies (pandas, scikit-learn,
# MLflow, etc.) and the hatchling build configuration that packages the `src` module.

[project]
name = "capspace-ml"
version = "0.1.0"
description = "ML training pipeline for pre-game predictions"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=2.0",
    "scikit-learn>=1.6",
    "mlflow>=2.0",
    "jupyterlab>=4.0",
    "ipykernel",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.0",
    "matplotlib>=3.0",
    "seaborn>=0.13",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
